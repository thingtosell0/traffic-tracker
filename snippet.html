<!-- Thing To Sell traffic counter. Paste in Ecwid Settings > General > Custom code (head).
     Replace TRACKER_URL with the Render app URL. -->
<script>
(function(){try{var i=new Image();i.referrerPolicy="no-referrer";i.src="TRACKER_URL/hit?p="+encodeURIComponent(location.pathname+location.search).slice(0,200)+"&r="+encodeURIComponent(document.referrer||"").slice(0,300);}catch(e){}})();
</script>
